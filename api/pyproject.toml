[project]
name = "api"
version = "0.1.0"
description = "Python API component for the spin-shortener URL shortener"
requires-python = ">=3.14"
dependencies = [
    "componentize-py==0.23.0",
    "pypng>=0.20220715.0",
    "qrcode>=8.2",
    "spin-sdk==4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
