<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>spin-shortener — Dashboard</title>
  <link rel="stylesheet" href="vendor/pico.min.css" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <header id="app-header" class="container"></header>

  <main class="container">
    <article>
      <h2>Create a new link</h2>
      <form id="create-form">
        <label for="target-url">Destination URL</label>
        <input id="target-url" name="target_url" type="url" placeholder="https://example.com/..." required />

        <!-- Custom link/schedule/password are all occasional-use for the
             primary paste-URL-and-submit action, so they collapse behind a
             disclosure toggle instead of rendering unconditionally — same
             collapse pattern as each row's edit-form elsewhere in the app,
             using the platform's own <details> instead of a bespoke toggle. -->
        <details id="advanced-options">
          <summary>More options</summary>
          <div class="grid">
            <label id="custom-slug-field" for="custom-slug" hidden>
              Custom short link (optional)
              <input id="custom-slug" name="custom_slug" type="text" pattern="[A-Za-z0-9_\-]{3,32}" minlength="3" maxlength="32" placeholder="my-link" />
            </label>
            <label for="start-at">
              Starts (optional)
              <input id="start-at" name="start_at" type="datetime-local" />
            </label>
            <label for="end-at">
              Expires (optional)
              <input id="end-at" name="end_at" type="datetime-local" />
            </label>
          </div>

          <label for="link-password">
            Password protection (optional)
            <input id="link-password" name="password" type="password" minlength="4" placeholder="Leave blank for no password" />
          </label>
        </details>

        <button type="submit">Shorten</button>
      </form>
      <p id="create-error" class="form-error" role="alert"></p>
      <p id="create-success" class="form-success" aria-live="polite" hidden></p>
    </article>

    <article>
      <h2 id="links-heading">Your links</h2>
      <label for="links-filter" class="visually-hidden">Filter links</label>
      <input type="search" id="links-filter" placeholder="Filter by short link or destination..." />
      <p id="links-error" class="form-error" role="alert"></p>
      <figure id="links-figure">
        <table id="links-table">
          <thead>
            <tr>
              <th class="sortable" data-sort-key="slug" tabindex="0" aria-sort="none">Short link<span class="sort-indicator"></span></th>
              <th class="sortable" data-sort-key="owner" tabindex="0" aria-sort="none">Owner<span class="sort-indicator"></span></th>
              <th class="sortable" data-sort-key="target_url" tabindex="0" aria-sort="none">Destination<span class="sort-indicator"></span></th>
              <th class="sortable" data-sort-key="created_at" tabindex="0" aria-sort="none">Created<span class="sort-indicator"></span></th>
              <th class="sortable" data-sort-key="status" tabindex="0" aria-sort="none">Status<span class="sort-indicator"></span></th>
              <th class="sortable" data-sort-key="start_at" tabindex="0" aria-sort="none">Starts<span class="sort-indicator"></span></th>
              <th class="sortable" data-sort-key="end_at" tabindex="0" aria-sort="none">Expires<span class="sort-indicator"></span></th>
              <th></th>
            </tr>
          </thead>
          <tbody id="links-body"></tbody>
        </table>
      </figure>
    </article>
  </main>

  <script src="app.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
