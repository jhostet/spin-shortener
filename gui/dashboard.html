<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>spin-shortener — Dashboard</title>
  <link rel="stylesheet" href="vendor/pico.min.css" />
  <link rel="stylesheet" href="theme.css" />
  <style>
    #links-table th.sortable { cursor: pointer; user-select: none; }
    #links-table th.sortable:hover { color: var(--pico-primary); }
    #links-figure { overflow-x: auto; }
    #links-table td:last-child { white-space: nowrap; }
    #links-table [role=group] {
      width: auto;
    }
    #links-table [role=group] > * {
      --pico-form-element-spacing-horizontal: 0.5rem;
      --pico-form-element-spacing-vertical: 0.3rem;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <header id="app-header" class="container"></header>

  <main class="container">
    <article>
      <h2>Create a new link</h2>
      <form id="create-form">
        <label for="target-url">Destination URL</label>
        <input id="target-url" name="target_url" type="url" placeholder="https://example.com/..." required />

        <div class="grid">
          <label id="custom-slug-field" for="custom-slug" style="display: none">
            Custom short link (optional)
            <input id="custom-slug" name="custom_slug" type="text" pattern="[A-Za-z0-9_\-]{3,32}" minlength="3" maxlength="32" placeholder="my-link" />
          </label>
          <label for="start-at">
            Starts (optional)
            <input id="start-at" name="start_at" type="datetime-local" />
          </label>
          <label for="end-at">
            Expires (optional)
            <input id="end-at" name="end_at" type="datetime-local" />
          </label>
        </div>

        <button type="submit">Shorten</button>
      </form>
      <p id="create-error" style="color: var(--pico-del-color)"></p>
    </article>

    <article>
      <h2 id="links-heading">Your links</h2>
      <input type="search" id="links-filter" placeholder="Filter by short link or destination..." />
      <figure id="links-figure">
        <table id="links-table">
          <thead>
            <tr>
              <th class="sortable" data-sort-key="slug">Short link<span class="sort-indicator"></span></th>
              <th class="sortable" data-sort-key="owner">Owner<span class="sort-indicator"></span></th>
              <th class="sortable" data-sort-key="target_url">Destination<span class="sort-indicator"></span></th>
              <th class="sortable" data-sort-key="created_at">Created<span class="sort-indicator"></span></th>
              <th class="sortable" data-sort-key="status">Status<span class="sort-indicator"></span></th>
              <th class="sortable" data-sort-key="start_at">Starts<span class="sort-indicator"></span></th>
              <th class="sortable" data-sort-key="end_at">Expires<span class="sort-indicator"></span></th>
              <th></th>
            </tr>
          </thead>
          <tbody id="links-body"></tbody>
        </table>
      </figure>
    </article>
  </main>

  <script src="app.js"></script>
  <script>
    async function loadMe() {
      const { ok, data } = await initHeader();
      if (ok) {
        if (data.role === "admin" || data.permissions.includes("links.create_custom_slug")) {
          document.getElementById("custom-slug-field").style.display = "";
        }
        if (data.role === "admin" || data.permissions.includes("links.view_all")) {
          document.getElementById("links-heading").textContent = "All links";
        }
      }
    }

    function formatWindowField(value) {
      return value ? escapeHtml(value) : "—";
    }

    let allLinks = [];
    let sortKey = null;
    let sortDir = 1;

    function updateSortIndicators() {
      document.querySelectorAll("#links-table th.sortable").forEach((th) => {
        const indicator = th.querySelector(".sort-indicator");
        indicator.textContent = th.dataset.sortKey === sortKey ? (sortDir === 1 ? " ▲" : " ▼") : "";
      });
    }

    function getVisibleLinks() {
      const term = document.getElementById("links-filter").value.trim().toLowerCase();
      let visible = !term
        ? allLinks
        : allLinks.filter(
            (link) => link.slug.toLowerCase().includes(term) || link.target_url.toLowerCase().includes(term)
          );

      if (sortKey) {
        // start_at/end_at may be null (unbounded window) — sort those first regardless of direction.
        visible = [...visible].sort(
          (a, b) => sortDir * String(a[sortKey] ?? "").localeCompare(String(b[sortKey] ?? ""))
        );
      }
      return visible;
    }

    function editRowHtml(link) {
      return `
        <tr class="edit-row" data-slug="${escapeHtml(link.slug)}">
          <td colspan="8">
            <div class="grid">
              <label>Starts <input type="datetime-local" class="edit-start-at" value="${isoToDatetimeLocal(link.start_at)}" /></label>
              <label>Expires <input type="datetime-local" class="edit-end-at" value="${isoToDatetimeLocal(link.end_at)}" /></label>
            </div>
            <button class="save-edit-btn">Save</button>
            <button class="cancel-edit-btn secondary outline" type="button">Cancel</button>
            <p class="edit-error" style="color: var(--pico-del-color)"></p>
          </td>
        </tr>
      `;
    }

    async function loadLinks() {
      const { ok, data } = await api.get("/links");
      if (!ok) return;
      allLinks = data.links;
      renderLinksTable();
    }

    function renderLinksTable() {
      const body = document.getElementById("links-body");
      body.innerHTML = "";
      updateSortIndicators();

      for (const link of getVisibleLinks()) {
        const shortUrl = `${location.origin}/r/${link.slug}`;
        const row = document.createElement("tr");
        row.dataset.slug = link.slug;
        row.innerHTML = `
          <td><a class="slug-chip" href="${escapeHtml(shortUrl)}" target="_blank">${escapeHtml(shortUrl)}</a></td>
          <td>${escapeHtml(link.owner)}</td>
          <td>${escapeHtml(link.target_url)}</td>
          <td>${escapeHtml(link.created_at)}</td>
          <td><span class="status-badge status-${escapeHtml(link.status)}">${escapeHtml(link.status)}</span></td>
          <td>${formatWindowField(link.start_at)}</td>
          <td>${formatWindowField(link.end_at)}</td>
          <td>
            <div role="group">
              <a role="button" class="outline" href="links/detail.html?slug=${encodeURIComponent(link.slug)}">View</a>
              <button data-slug="${escapeHtml(link.slug)}" class="edit-btn outline">Edit</button>
              <button data-slug="${escapeHtml(link.slug)}" class="delete-btn secondary outline">Delete</button>
            </div>
          </td>
        `;
        body.appendChild(row);
        row.insertAdjacentHTML("afterend", editRowHtml(link));
        body.querySelector(`tr.edit-row[data-slug="${CSS.escape(link.slug)}"]`).style.display = "none";
      }

      body.querySelectorAll(".delete-btn").forEach((btn) => {
        btn.addEventListener("click", async () => {
          await api.delete(`/links/${btn.dataset.slug}`);
          loadLinks();
        });
      });

      body.querySelectorAll(".edit-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const editRow = body.querySelector(`tr.edit-row[data-slug="${CSS.escape(btn.dataset.slug)}"]`);
          editRow.style.display = editRow.style.display === "none" ? "" : "none";
        });
      });

      body.querySelectorAll(".cancel-edit-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          btn.closest("tr.edit-row").style.display = "none";
        });
      });

      body.querySelectorAll(".save-edit-btn").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const editRow = btn.closest("tr.edit-row");
          const slug = editRow.dataset.slug;
          const startAt = datetimeLocalToIso(editRow.querySelector(".edit-start-at").value);
          const endAt = datetimeLocalToIso(editRow.querySelector(".edit-end-at").value);
          const errorEl = editRow.querySelector(".edit-error");
          errorEl.textContent = "";

          const { ok, data } = await api.patch(`/links/${slug}`, { start_at: startAt, end_at: endAt });
          if (!ok) {
            errorEl.textContent = (data && data.error) || "Could not update link";
            return;
          }
          loadLinks();
        });
      });
    }

    document.getElementById("create-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const targetUrl = document.getElementById("target-url").value;
      const customSlug = document.getElementById("custom-slug").value.trim() || null;
      const startAt = datetimeLocalToIso(document.getElementById("start-at").value);
      const endAt = datetimeLocalToIso(document.getElementById("end-at").value);
      const errorEl = document.getElementById("create-error");
      errorEl.textContent = "";

      const { ok, data } = await api.post("/links", {
        target_url: targetUrl,
        custom_slug: customSlug,
        start_at: startAt,
        end_at: endAt,
      });
      if (!ok) {
        errorEl.textContent = (data && data.error) || "Could not create link";
        return;
      }
      document.getElementById("target-url").value = "";
      document.getElementById("custom-slug").value = "";
      document.getElementById("start-at").value = "";
      document.getElementById("end-at").value = "";
      loadLinks();
    });

    document.getElementById("links-filter").addEventListener("input", renderLinksTable);

    document.querySelectorAll("#links-table th.sortable").forEach((th) => {
      th.addEventListener("click", () => {
        const key = th.dataset.sortKey;
        sortDir = sortKey === key ? -sortDir : 1;
        sortKey = key;
        renderLinksTable();
      });
    });

    loadMe();
    loadLinks();
  </script>
</body>
</html>
