<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>spin-shortener — Dashboard</title>
  <link rel="stylesheet" href="vendor/pico.min.css" />
</head>
<body>
  <header class="container">
    <nav>
      <ul><li><strong>spin-shortener</strong></li></ul>
      <ul>
        <li id="whoami"></li>
        <li id="manage-users-link" style="display: none"><a href="admin/users.html">Manage users</a></li>
        <li><button id="logout-btn" class="secondary outline">Log out</button></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <article>
      <h2>Create a new link</h2>
      <form id="create-form">
        <label for="target-url">Destination URL</label>
        <input id="target-url" name="target_url" type="url" placeholder="https://example.com/..." required />

        <div id="custom-slug-field" style="display: none">
          <label for="custom-slug">
            Custom short link (optional)
            <input id="custom-slug" name="custom_slug" type="text" pattern="[A-Za-z0-9_\-]{3,32}" minlength="3" maxlength="32" placeholder="my-link" />
          </label>
        </div>

        <div class="grid">
          <label for="start-at">
            Starts (optional)
            <input id="start-at" name="start_at" type="datetime-local" />
          </label>
          <label for="end-at">
            Expires (optional)
            <input id="end-at" name="end_at" type="datetime-local" />
          </label>
        </div>

        <button type="submit">Shorten</button>
      </form>
      <p id="create-error" style="color: var(--pico-del-color)"></p>
    </article>

    <article>
      <h2>Your links</h2>
      <figure>
        <table id="links-table">
          <thead>
            <tr>
              <th>Short link</th>
              <th>Destination</th>
              <th>Created</th>
              <th>Status</th>
              <th>Starts</th>
              <th>Expires</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="links-body"></tbody>
        </table>
      </figure>
    </article>
  </main>

  <script src="app.js"></script>
  <script>
    async function loadMe() {
      const { ok, data } = await api.get("/auth/me");
      if (ok) {
        document.getElementById("whoami").textContent = `${data.username} (${data.role})`;
        if (data.role === "admin" || data.permissions.includes("users.manage")) {
          document.getElementById("manage-users-link").style.display = "";
        }
        if (data.role === "admin" || data.permissions.includes("links.create_custom_slug")) {
          document.getElementById("custom-slug-field").style.display = "";
        }
      }
    }

    function formatWindowField(value) {
      return value ? escapeHtml(value) : "—";
    }

    function editRowHtml(link) {
      return `
        <tr class="edit-row" data-slug="${escapeHtml(link.slug)}">
          <td colspan="7">
            <div class="grid">
              <label>Starts <input type="datetime-local" class="edit-start-at" value="${isoToDatetimeLocal(link.start_at)}" /></label>
              <label>Expires <input type="datetime-local" class="edit-end-at" value="${isoToDatetimeLocal(link.end_at)}" /></label>
            </div>
            <button class="save-edit-btn">Save</button>
            <button class="cancel-edit-btn secondary outline" type="button">Cancel</button>
            <p class="edit-error" style="color: var(--pico-del-color)"></p>
          </td>
        </tr>
      `;
    }

    async function loadLinks() {
      const { ok, data } = await api.get("/links");
      const body = document.getElementById("links-body");
      body.innerHTML = "";
      if (!ok) return;

      for (const link of data.links) {
        const shortUrl = `${location.origin}/r/${link.slug}`;
        const row = document.createElement("tr");
        row.dataset.slug = link.slug;
        row.innerHTML = `
          <td><a href="${escapeHtml(shortUrl)}" target="_blank">${escapeHtml(shortUrl)}</a></td>
          <td>${escapeHtml(link.target_url)}</td>
          <td>${escapeHtml(link.created_at)}</td>
          <td>${escapeHtml(link.status)}</td>
          <td>${formatWindowField(link.start_at)}</td>
          <td>${formatWindowField(link.end_at)}</td>
          <td>
            <a href="links/detail.html?slug=${encodeURIComponent(link.slug)}">View</a> &nbsp;
            <button data-slug="${escapeHtml(link.slug)}" class="edit-btn outline">Edit</button>
            <button data-slug="${escapeHtml(link.slug)}" class="delete-btn secondary outline">Delete</button>
          </td>
        `;
        body.appendChild(row);
        row.insertAdjacentHTML("afterend", editRowHtml(link));
        body.querySelector(`tr.edit-row[data-slug="${CSS.escape(link.slug)}"]`).style.display = "none";
      }

      body.querySelectorAll(".delete-btn").forEach((btn) => {
        btn.addEventListener("click", async () => {
          await api.delete(`/links/${btn.dataset.slug}`);
          loadLinks();
        });
      });

      body.querySelectorAll(".edit-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const editRow = body.querySelector(`tr.edit-row[data-slug="${CSS.escape(btn.dataset.slug)}"]`);
          editRow.style.display = editRow.style.display === "none" ? "" : "none";
        });
      });

      body.querySelectorAll(".cancel-edit-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          btn.closest("tr.edit-row").style.display = "none";
        });
      });

      body.querySelectorAll(".save-edit-btn").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const editRow = btn.closest("tr.edit-row");
          const slug = editRow.dataset.slug;
          const startAt = datetimeLocalToIso(editRow.querySelector(".edit-start-at").value);
          const endAt = datetimeLocalToIso(editRow.querySelector(".edit-end-at").value);
          const errorEl = editRow.querySelector(".edit-error");
          errorEl.textContent = "";

          const { ok, data } = await api.patch(`/links/${slug}`, { start_at: startAt, end_at: endAt });
          if (!ok) {
            errorEl.textContent = (data && data.error) || "Could not update link";
            return;
          }
          loadLinks();
        });
      });
    }

    document.getElementById("create-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const targetUrl = document.getElementById("target-url").value;
      const customSlug = document.getElementById("custom-slug").value.trim() || null;
      const startAt = datetimeLocalToIso(document.getElementById("start-at").value);
      const endAt = datetimeLocalToIso(document.getElementById("end-at").value);
      const errorEl = document.getElementById("create-error");
      errorEl.textContent = "";

      const { ok, data } = await api.post("/links", {
        target_url: targetUrl,
        custom_slug: customSlug,
        start_at: startAt,
        end_at: endAt,
      });
      if (!ok) {
        errorEl.textContent = (data && data.error) || "Could not create link";
        return;
      }
      document.getElementById("target-url").value = "";
      document.getElementById("custom-slug").value = "";
      document.getElementById("start-at").value = "";
      document.getElementById("end-at").value = "";
      loadLinks();
    });

    document.getElementById("logout-btn").addEventListener("click", async () => {
      await api.post("/auth/logout");
      setCsrfToken(null);
      location.href = "/login.html";
    });

    loadMe();
    loadLinks();
  </script>
</body>
</html>
