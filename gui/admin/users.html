<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>spin-shortener — Manage users</title>
  <script src="../theme-init.js"></script>
  <link rel="stylesheet" href="../vendor/pico.min.css" />
  <link rel="stylesheet" href="../theme.css" />
  <link rel="stylesheet" href="users.css" />
</head>
<body>
  <header id="app-header" class="container"></header>

  <main class="container">
    <h1>Manage users</h1>
    <p id="forbidden-notice" class="form-error" role="alert" hidden>
      You don't have permission to manage users.
    </p>

    <div id="admin-content">
      <article>
        <h2>Create a user</h2>
        <form id="create-form">
          <label for="new-username">Username
            <input id="new-username" type="text" required />
          </label>
          <label for="new-password">Password
            <input id="new-password" type="password" required minlength="8" />
          </label>
          <div class="grid">
            <label for="new-role">Role
              <select id="new-role">
                <option value="user">user</option>
                <option value="admin">admin</option>
              </select>
            </label>
            <fieldset id="new-permissions-fieldset">
              <!-- Checkboxes are appended by users.js from ALL_PERMISSIONS,
                   the same list the edit form uses. They were hardcoded here
                   once and drifted out of sync with it. -->
              <legend id="new-permissions-legend">Permissions (for role "user")</legend>
            </fieldset>
            <fieldset id="new-domains-fieldset" hidden></fieldset>
          </div>
          <button type="submit">Create user</button>
        </form>
        <p id="create-error" class="form-error" role="alert"></p>
        <p id="create-success" class="form-success" aria-live="polite" hidden></p>
      </article>

      <article>
        <h2>Users</h2>
        <p><a href="backup.html">Backup and restore</a></p>
        <p id="password-reset-notice" class="form-error" role="alert" hidden></p>
        <p id="users-error" class="form-error" role="alert"></p>
        <p id="users-error-action" hidden><a id="show-owner-links">Show these links on the dashboard</a></p>
        <figure>
          <table id="users-table">
            <thead>
              <tr>
                <th>Username</th>
                <th>Role</th>
                <th>Permissions</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="users-body"></tbody>
          </table>
        </figure>
      </article>
    </div>
  </main>

  <script src="../app.js"></script>
  <script src="users.js"></script>
</body>
</html>
