<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>spin-shortener — Link details</title>
  <link rel="stylesheet" href="../vendor/pico.min.css" />
  <link rel="stylesheet" href="../theme.css" />
  <style>
    .detail-heading {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    /* Pico's [role=group] defaults to width:100% with flex:1 1 auto
     * children, so an unscoped group next to the heading would stretch
     * Copy/Edit across the full container width instead of sizing to
     * their own content — the same bug already found and fixed on the
     * dashboard/admin edit-row Save/Cancel groups. */
    .detail-heading [role=group] {
      width: auto;
    }
  </style>
</head>
<body>
  <header id="app-header" class="container"></header>
  <div class="container">
    <div class="detail-heading">
      <h1 id="short-link-heading" class="slug-chip">Link details</h1>
      <div role="group">
        <button id="detail-copy-btn" type="button" class="outline">Copy</button>
        <a id="detail-edit-link" role="button" class="outline">Edit</a>
      </div>
    </div>
    <p id="page-error" class="form-error" role="alert"></p>
  </div>

  <main class="container">
    <div class="grid">
      <article id="link-info">
        <h2>Details</h2>
        <p><strong>Destination:</strong> <span id="target-url"></span></p>
        <p><strong>Status:</strong> <span id="status" class="status-badge"></span></p>
        <p><strong>Custom short link:</strong> <span id="custom-slug-status"></span></p>
        <p><strong>Password:</strong> <span id="password-status"></span></p>
        <p><strong>Starts:</strong> <span id="start-at"></span></p>
        <p><strong>Expires:</strong> <span id="end-at"></span></p>
      </article>

      <article id="qr-section">
        <h2>QR code</h2>
        <img id="qr-preview" alt="QR code for this link" width="200" height="200" />
        <p>
          <a id="qr-svg-download" role="button" class="outline" download>Download SVG</a>
          <a id="qr-png-download" role="button" class="outline" download>Download PNG</a>
        </p>
      </article>
    </div>

    <article id="analytics-section">
      <h2>Analytics</h2>
      <p><strong>Total clicks:</strong> <span id="total-clicks">0</span></p>

      <div class="grid">
        <div>
          <h3>Clicks per day</h3>
          <figure>
            <table id="days-table">
              <thead><tr><th>Day</th><th>Clicks</th></tr></thead>
              <tbody id="days-body"></tbody>
            </table>
          </figure>
        </div>

        <div>
          <h3>Recent events</h3>
          <figure>
            <table id="events-table">
              <thead><tr><th>When</th><th>Referrer</th><th>Device</th></tr></thead>
              <tbody id="events-body"></tbody>
            </table>
          </figure>
        </div>
      </div>
    </article>
  </main>

  <script src="../app.js"></script>
  <script>
    const slug = new URLSearchParams(location.search).get("slug");

    function formatDateTime(iso) {
      return new Intl.DateTimeFormat(undefined, { dateStyle: "medium", timeStyle: "short" }).format(new Date(iso));
    }

    async function loadLinkInfo() {
      const { ok, data } = await api.get(`/links/${slug}`);
      if (!ok) {
        document.getElementById("page-error").textContent = friendlyError(data, "Could not load this link.");
        return;
      }

      const shortUrl = `${location.origin}/r/${slug}`;
      document.getElementById("short-link-heading").textContent = shortUrl;
      document.getElementById("detail-copy-btn").addEventListener("click", (evt) => copyToClipboard(shortUrl, evt.currentTarget));
      document.getElementById("target-url").textContent = data.target_url;
      const statusEl = document.getElementById("status");
      statusEl.textContent = data.status;
      statusEl.classList.add(`status-${data.status}`);
      document.getElementById("custom-slug-status").textContent = data.custom ? "Yes" : "No";
      document.getElementById("password-status").textContent = data.password_protected ? "Password-protected" : "None";
      document.getElementById("start-at").textContent = data.start_at ? formatDateTime(data.start_at) : "—";
      document.getElementById("end-at").textContent = data.end_at ? formatDateTime(data.end_at) : "—";

      document.getElementById("qr-preview").src = `/api/links/${slug}/qr?format=png&size=web`;
      document.getElementById("qr-svg-download").href = `/api/links/${slug}/qr?format=svg&size=print&download=1`;
      document.getElementById("qr-png-download").href = `/api/links/${slug}/qr?format=png&size=print&download=1`;
    }

    async function loadAnalytics() {
      const { ok, data } = await api.get(`/links/${slug}/analytics`);
      if (!ok) {
        document.getElementById("page-error").textContent = friendlyError(data, "Could not load analytics for this link.");
        return;
      }

      document.getElementById("total-clicks").textContent = data.total;

      const daysBody = document.getElementById("days-body");
      daysBody.innerHTML = "";
      const sortedDays = Object.entries(data.days).sort((a, b) => b[0].localeCompare(a[0]));
      if (!sortedDays.length) {
        daysBody.innerHTML = `<tr><td colspan="2" class="empty-state">No clicks yet.</td></tr>`;
      }
      for (const [day, count] of sortedDays) {
        const row = document.createElement("tr");
        row.innerHTML = `<td>${escapeHtml(day)}</td><td>${escapeHtml(String(count))}</td>`;
        daysBody.appendChild(row);
      }

      const eventsBody = document.getElementById("events-body");
      eventsBody.innerHTML = "";
      if (!data.recent_events.length) {
        eventsBody.innerHTML = `<tr><td colspan="3" class="empty-state">No recent events yet.</td></tr>`;
      }
      for (const event of data.recent_events) {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${escapeHtml(formatDateTime(event.timestamp))}</td>
          <td>${escapeHtml(event.referrer || "(direct)")}</td>
          <td>${escapeHtml(event.device_class)}</td>
        `;
        eventsBody.appendChild(row);
      }
    }

    initHeader({ backHref: "../dashboard.html", manageUsersHref: "../admin/users.html" });

    if (!slug) {
      document.body.textContent = "No link specified.";
    } else {
      document.getElementById("detail-edit-link").href = `../dashboard.html?edit=${encodeURIComponent(slug)}`;
      loadLinkInfo();
      loadAnalytics();
    }
  </script>
</body>
</html>
