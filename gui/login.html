<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>spin-shortener — Log in</title>
  <link rel="stylesheet" href="vendor/pico.min.css" />
</head>
<body>
  <main class="container" style="max-width: 26rem; margin-top: 8vh;">
    <article>
      <hgroup>
        <h1>spin-shortener</h1>
        <p>Log in to manage your links</p>
      </hgroup>
      <form id="login-form">
        <label for="username">
          Username
          <input id="username" name="username" type="text" required autofocus />
        </label>
        <label for="password">
          Password
          <input id="password" name="password" type="password" required />
        </label>
        <button type="submit">Log in</button>
      </form>
      <p id="error" style="color: var(--pico-del-color)"></p>
    </article>
  </main>

  <script src="app.js"></script>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const errorEl = document.getElementById("error");
      errorEl.textContent = "";

      const { ok, data } = await api.post("/auth/login", { username, password });
      if (!ok) {
        errorEl.textContent = friendlyError(data, "Login failed. Please try again.");
        return;
      }
      setCsrfToken(data.csrf_token);
      location.href = "dashboard.html";
    });
  </script>
</body>
</html>
