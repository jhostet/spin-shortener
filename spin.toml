spin_manifest_version = 2

[application]
name = "spin-shortener"
version = "0.1.0"
authors = ["jhostetler"]
description = "Polyglot Wasm URL shortener with redirect, API, and GUI components."

[variables]
admin_bootstrap_username = { default = "admin" }
admin_bootstrap_password = { required = true, secret = true }
cookie_secure = { default = "true" }
public_base_url = { default = "http://localhost:3000" }
analytics_event_slots = { default = "30" }
analytics_day_retention_days = { default = "90" }

[[trigger.http]]
route = "/r/..."
component = "redirect"

[component.redirect]
source = "redirect/main.wasm"
allowed_outbound_hosts = []
key_value_stores = ["links", "analytics"]
[component.redirect.variables]
analytics_event_slots = "{{ analytics_event_slots }}"
analytics_day_retention_days = "{{ analytics_day_retention_days }}"
[component.redirect.build]
command = "go tool componentize-go build"
workdir = "redirect"
watch = ["**/*.go", "go.mod"]

[[trigger.http]]
route = "/api/..."
component = "api"

[component.api]
source = "api/app.wasm"
key_value_stores = ["links", "users", "analytics"]
[component.api.variables]
admin_bootstrap_username = "{{ admin_bootstrap_username }}"
admin_bootstrap_password = "{{ admin_bootstrap_password }}"
cookie_secure = "{{ cookie_secure }}"
public_base_url = "{{ public_base_url }}"
analytics_event_slots = "{{ analytics_event_slots }}"
[component.api.build]
command = "uv run componentize-py -w spin:up/http-trigger@4.0.0 componentize app -o app.wasm"
workdir = "api"
watch = ["*.py", "pyproject.toml", "uv.lock"]

# Security response headers (CSP, X-Frame-Options, etc.) are only
# meaningful on the navigated document itself, not on a .js/.css
# subresource, so only these 3 genuinely-static asset routes stay on the
# existing, battle-tested static-fileserver binary. Spin resolves routing
# by specificity regardless of declaration order, so these exact/prefix
# routes correctly win over the gui-pages catch-all below for these paths.
[[trigger.http]]
route = "/app.js"
component = "gui"

[[trigger.http]]
route = "/theme.css"
component = "gui"

# Exact route, not a "/vendor/..." wildcard — confirmed live that once this
# component has more than one trigger route, spin_static_fs's internal path
# resolution breaks specifically for wildcard routes (a wildcard route
# 404'd on every request; the identical file under an exact route served
# correctly), a real gotcha in the vendored binary, not a config mistake.
# Only pico.min.css is actually loaded by any page (confirmed via grep —
# vendor/NOTICE.txt, a license file, is never referenced), so one exact
# route fully covers this directory's real usage.
[[trigger.http]]
route = "/vendor/pico.min.css"
component = "gui"

[component.gui]
source = { url = "https://github.com/spinframework/spin-fileserver/releases/download/v0.3.0/spin_static_fs.wasm", digest = "sha256:ef88708817e107bf49985c7cefe4dd1f199bf26f6727819183d5c996baa3d148" }
# Kept as the original single directory mapping rather than split into
# per-asset entries — a directory source mapped to a non-root destination
# (e.g. { source = "gui/vendor", destination = "/vendor" }) also 404'd live,
# consistent with the wildcard-route gotcha above; reverting to the
# known-working shape was safer than further debugging spin_static_fs's
# internals for a cosmetic tidiness gain. The 3 routes above are what
# actually restrict this component's real reachable surface — its
# filesystem view still containing the now-unroutable HTML files is
# harmless, since nothing can dispatch a request to them.
files = [{ source = "gui", destination = "/" }]

[[trigger.http]]
route = "/..."
component = "gui-pages"

[component.gui-pages]
source = "gui-pages/app.wasm"
files = [{ source = "gui", destination = "/gui" }]
[component.gui-pages.build]
command = "uv run componentize-py -w spin:up/http-trigger@4.0.0 componentize app -o app.wasm"
workdir = "gui-pages"
watch = ["*.py", "pyproject.toml", "uv.lock"]
