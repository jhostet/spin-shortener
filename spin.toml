spin_manifest_version = 2

[application]
name = "spin-shortener"
version = "0.1.0"
authors = ["jhostetler"]
description = "Polyglot Wasm URL shortener with redirect, API, and GUI components."

[variables]
admin_bootstrap_username = { default = "admin" }
admin_bootstrap_password = { required = true, secret = true }
cookie_secure = { default = "true" }
public_base_urls = { default = "http://localhost:3000" }
analytics_day_retention_days = { default = "90" }
log_level = { default = "off" }
log_debug_token = { default = "", secret = true }
# Emitted as X-SS-Version on every response from redirect, api and gui-pages.
# Operator-supplied and opaque: pass whatever identifies the build (a git SHA,
# a date, a release label) via `--variable app_version=...` at deploy time. It
# exists because a deploy takes longer to propagate than `spin aka app deploy`
# waits, so "is the new build live yet?" was otherwise unanswerable without a
# behavioural probe. Default "unknown" means nobody set it.
app_version = { default = "unknown" }

[[trigger.http]]
route = "/r/..."
component = "redirect"

[component.redirect]
source = "redirect/main.wasm"
allowed_outbound_hosts = []
key_value_stores = ["default"]
[component.redirect.variables]
analytics_day_retention_days = "{{ analytics_day_retention_days }}"
log_level = "{{ log_level }}"
log_debug_token = "{{ log_debug_token }}"
app_version = "{{ app_version }}"
[component.redirect.build]
command = "go tool componentize-go build"
workdir = "redirect"
watch = ["**/*.go", "go.mod"]

[[trigger.http]]
route = "/api/..."
component = "api"

[component.api]
source = "api/app.wasm"
key_value_stores = ["default"]
[component.api.variables]
admin_bootstrap_username = "{{ admin_bootstrap_username }}"
admin_bootstrap_password = "{{ admin_bootstrap_password }}"
cookie_secure = "{{ cookie_secure }}"
public_base_urls = "{{ public_base_urls }}"
log_level = "{{ log_level }}"
log_debug_token = "{{ log_debug_token }}"
app_version = "{{ app_version }}"
[component.api.build]
command = "uv run componentize-py -w spin:up/http-trigger@4.0.0 componentize app -o app.wasm"
workdir = "api"
watch = ["*.py", "pyproject.toml", "uv.lock"]

# Security response headers (CSP, X-Frame-Options, etc.) are only
# meaningful on the navigated document itself, not on a .js/.css
# subresource, so the GUI's genuinely-static asset routes stay on the
# existing, battle-tested static-fileserver binary. Spin resolves routing
# by specificity regardless of declaration order, so these exact/prefix
# routes correctly win over the gui-pages catch-all below for these paths.
[[trigger.http]]
route = "/app.js"
component = "gui"

[[trigger.http]]
route = "/theme.css"
component = "gui"

# Exact route, not a "/vendor/..." wildcard — confirmed live that once this
# component has more than one trigger route, spin_static_fs's internal path
# resolution breaks specifically for wildcard routes (a wildcard route
# 404'd on every request; the identical file under an exact route served
# correctly), a real gotcha in the vendored binary, not a config mistake.
# Only pico.min.css is actually loaded by any page (confirmed via grep —
# vendor/NOTICE.txt, a license file, is never referenced), so one exact
# route fully covers this directory's real usage.
[[trigger.http]]
route = "/vendor/pico.min.css"
component = "gui"

# Per-page scripts and styles, one file per page. These were inline
# <script>/<style> blocks until the gui-pages CSP dropped 'unsafe-inline'
# from script-src/style-src, which made externalizing them mandatory —
# see docs/plans/csp-drop-unsafe-inline.md. Exact routes only, for the
# same reason /vendor/pico.min.css is one: wildcards 404 on this
# component. Adding a page's asset here is required, not optional — a
# missing route serves a fully-rendered page whose script silently 404s,
# so the page looks fine and simply does nothing.
#
# /theme-init.js is the one exception to "one file per page" in this
# block: it is loaded by every real page (not index.html — see
# docs/plans/light-dark-theme.md), first in <head>, to set
# data-theme before first paint and avoid a light-then-dark flash.
[[trigger.http]]
route = "/theme-init.js"
component = "gui"

[[trigger.http]]
route = "/index.js"
component = "gui"

[[trigger.http]]
route = "/login.js"
component = "gui"

[[trigger.http]]
route = "/links/detail.js"
component = "gui"

[[trigger.http]]
route = "/links/detail.css"
component = "gui"

[[trigger.http]]
route = "/admin/users.js"
component = "gui"

[[trigger.http]]
route = "/admin/users.css"
component = "gui"

[[trigger.http]]
route = "/admin/backup.js"
component = "gui"

[[trigger.http]]
route = "/admin/url-policy.js"
component = "gui"

[[trigger.http]]
route = "/admin/url-policy.css"
component = "gui"

# SVG only, and no /favicon.ico route: there is no .ico file to serve, and a
# browser only makes the unprompted /favicon.ico request for a page that
# declares no <link rel="icon"> — which, after this change, is just the
# redirect component's password prompt. That page is deliberately left
# without one: its CSP is the strictest in the app (`default-src 'none'`),
# a favicon is fetched under img-src, and widening the one policy that
# guards the page where a visitor types a credential is not worth a tab icon.
[[trigger.http]]
route = "/favicon.svg"
component = "gui"

[[trigger.http]]
route = "/dashboard.js"
component = "gui"

[[trigger.http]]
route = "/dashboard.css"
component = "gui"

[component.gui]
source = { url = "https://github.com/spinframework/spin-fileserver/releases/download/v0.3.0/spin_static_fs.wasm", digest = "sha256:ef88708817e107bf49985c7cefe4dd1f199bf26f6727819183d5c996baa3d148" }
# Kept as the original single directory mapping rather than split into
# per-asset entries — a directory source mapped to a non-root destination
# (e.g. { source = "gui/vendor", destination = "/vendor" }) also 404'd live,
# consistent with the wildcard-route gotcha above; reverting to the
# known-working shape was safer than further debugging spin_static_fs's
# internals for a cosmetic tidiness gain. The exact routes above are what
# actually restrict this component's real reachable surface — its
# filesystem view still containing the now-unroutable HTML files is
# harmless, since nothing can dispatch a request to them.
files = [{ source = "gui", destination = "/" }]

[[trigger.http]]
route = "/..."
component = "gui-pages"

[component.gui-pages]
source = "gui-pages/app.wasm"
files = [{ source = "gui", destination = "/gui" }]
[component.gui-pages.variables]
app_version = "{{ app_version }}"
[component.gui-pages.build]
command = "uv run componentize-py -w spin:up/http-trigger@4.0.0 componentize app -o app.wasm"
workdir = "gui-pages"
watch = ["*.py", "pyproject.toml", "uv.lock"]
