spin_manifest_version = 2

[application]
name = "spin-shortener"
version = "0.1.0"
authors = ["jhostetler"]
description = "Polyglot Wasm URL shortener with redirect, API, and GUI components."

[variables]
admin_bootstrap_username = { default = "admin" }
admin_bootstrap_password = { required = true, secret = true }
cookie_secure = { default = "true" }
public_base_url = { default = "http://localhost:3000" }

[[trigger.http]]
route = "/r/..."
component = "redirect"

[component.redirect]
source = "redirect/main.wasm"
allowed_outbound_hosts = []
key_value_stores = ["links", "analytics"]
[component.redirect.build]
command = "go tool componentize-go build"
workdir = "redirect"
watch = ["**/*.go", "go.mod"]

[[trigger.http]]
route = "/api/..."
component = "api"

[component.api]
source = "api/app.wasm"
key_value_stores = ["links", "users", "analytics"]
[component.api.variables]
admin_bootstrap_username = "{{ admin_bootstrap_username }}"
admin_bootstrap_password = "{{ admin_bootstrap_password }}"
cookie_secure = "{{ cookie_secure }}"
public_base_url = "{{ public_base_url }}"
[component.api.build]
command = "uv run componentize-py -w spin:up/http-trigger@4.0.0 componentize app -o app.wasm"
workdir = "api"
watch = ["*.py", "pyproject.toml", "uv.lock"]

[[trigger.http]]
route = "/..."
component = "gui"

[component.gui]
source = { url = "https://github.com/spinframework/spin-fileserver/releases/download/v0.3.0/spin_static_fs.wasm", digest = "sha256:ef88708817e107bf49985c7cefe4dd1f199bf26f6727819183d5c996baa3d148" }
files = [{ source = "gui", destination = "/" }]
